[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-fluid-hypothesis"
version = "0.1.0.dev0"
description = "Research foundations for a relativistic dark-fluid hypothesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["darkfluid", "darkfluid.*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["experiments", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
